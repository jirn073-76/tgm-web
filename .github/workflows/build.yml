name: build-and-push

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Besitzername in Kleinbuchstaben
        id: namen
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: An GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.namen.outputs.owner }}/tgm-web:${{ github.sha }}
            ghcr.io/${{ steps.namen.outputs.owner }}/tgm-web:latest

      - name: Zusammenfassung schreiben
        run: |
          echo "Gebaut: ghcr.io/${{ steps.namen.outputs.owner }}/tgm-web:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Bildmarke im Manifest setzen
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          sed -i "s|image: ghcr.io/.*/tgm-web:.*|image: ghcr.io/${OWNER}/tgm-web:${GITHUB_SHA}|" k8s/deployment.yaml
          grep "image:" k8s/deployment.yaml

      - name: Änderung zurückschreiben
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "Manifest auf ${GITHUB_SHA} gesetzt" || echo "keine Änderung"
          git push
